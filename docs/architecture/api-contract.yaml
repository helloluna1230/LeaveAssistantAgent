openapi: 3.1.0
info:
  title: Leave Assistant — Frontend ↔ Hosted Agent Contract
  version: 1.0.0
  description: >
    Single source of truth for the Web Chat UI ↔ Foundry Hosted Agent (Responses
    protocol) interaction, and the demo identity endpoints. All HR data is
    SIMULATED. Update this file BEFORE changing either side.
servers:
  - url: http://localhost:8088
    description: Local hosted-agent host (azd ai agent run / python main.py)
  - url: "{foundryProjectEndpoint}"
    description: Deployed Foundry hosted agent
    variables:
      foundryProjectEndpoint:
        default: https://your-project.services.ai.azure.com

paths:
  /responses:
    post:
      operationId: createResponse
      summary: Send a user turn to the agent (Responses protocol).
      parameters:
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: >
            Platform authorization bearer when required by the hosting layer.
            Demo user identity is carried separately in X-User-Token.
        - in: header
          name: X-User-Token
          required: false
          schema: { type: string }
          description: >
            Demo employee id selected through /demo/token. This value is not a
            credential; the downstream MCP accepts it only after validating its
            server-to-server API key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseRequest' }
      responses:
        '200':
          description: Agent response (non-streaming) or SSE stream when stream=true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseResult' }
            text/event-stream:
              schema: { type: string }
        '401': { description: Missing/invalid demo identity }

  /session/state:
    get:
      operationId: getSessionState
      summary: Read the caller's conversation bookmark (identity-scoped).
      description: >
        Returns the resolved caller's last saved Responses pointer so a returning
        user (even on a new device) can rehydrate their thread from the platform
        Responses store. Identity comes from request context, never the client body.
        Stores no chat content — only a Responses pointer.
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The saved pointer, or an empty object if none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPointer' }
        '401': { description: Missing/invalid demo identity }
    post:
      operationId: saveSessionState
      summary: Save the caller's conversation bookmark (identity-scoped).
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPointer' }
      responses:
        '200':
          description: The persisted pointer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPointer' }
        '401': { description: Missing/invalid demo identity }

  /demo/token:
    post:
      operationId: issueDemoToken
      summary: Resolve a validated demo identity for a simulated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id:
                  type: string
                  enum: [E1001, E1002, M1001]
      responses:
        '200':
          description: A validated demo identity identifier (not a credential).
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  employee_id: { type: string }
                  name: { type: string }
                  role: { type: string, enum: [employee, manager] }

components:
  schemas:
    SessionPointer:
      type: object
      description: >
        A lightweight, identity-scoped conversation bookmark. Contains NO chat
        content — only the Responses pointer used to rehydrate a thread.
      properties:
        previous_response_id:
          type: string
          nullable: true
          description: Last response id; drives server-side continuation and rehydration.
        conversation:
          type: string
          nullable: true
    ResponseRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: The user's message for this turn.
        conversation:
          type: string
          nullable: true
          description: Conversation id to continue a multi-turn thread.
        previous_response_id:
          type: string
          nullable: true
          description: Response id to chain from (Responses protocol continuation).
        store:
          type: boolean
          default: true
          description: >
            When true (default), the conversation turn is persisted by the
            Foundry Responses platform store and resolved server-side via
            previous_response_id — the client does NOT resend prior turns.
            Retrieval/isolation is scoped to the verified caller identity.
        stream:
          type: boolean
          default: true
    ResponseResult:
      type: object
      properties:
        id: { type: string, description: Response id (use as previous_response_id). }
        conversation: { type: string, nullable: true }
        output_text: { type: string }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCallTrace' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        agent_version: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        simulated: { type: boolean, default: true }
    ToolCallTrace:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [running, ok, error, awaiting_confirmation] }
        error_type: { type: string, nullable: true }
    Citation:
      type: object
      properties:
        source: { type: string, description: e.g. hr-leave-policies }
        section: { type: string }
